<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>サンタ、ちゃんと届けて</title>
<style>
  :root{
    --ink:#fff8ee;
    --red:#e0413a;
    --gold:#ffd27a;
    --jp:"Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Meiryo","Noto Sans JP",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b1430;color:var(--ink);font-family:var(--jp);
    touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100%;height:100%}

  /* ---- タイトル ---- */
  #title{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;padding:16px;text-align:center;cursor:pointer;background:rgba(8,14,36,.55)}
  #title h1{font-size:clamp(28px,6vw,56px);letter-spacing:.08em;text-shadow:0 2px 18px rgba(0,0,0,.6)}
  #title h1 span{color:var(--red)}
  #title p{font-size:clamp(14px,2.4vw,18px);color:var(--gold);letter-spacing:.2em}
  #title small{font-size:13px;opacity:.75;line-height:1.8}
  #title.off{display:none}

  /* ---- 操作のヒント（PC のみ） ---- */
  #hint{position:fixed;left:16px;bottom:16px;z-index:5;font-size:13px;opacity:.7;pointer-events:none;text-shadow:0 1px 6px #000}
  body.touch #hint{display:none}

  /* ---- スマホの移動スティック（触れた場所に出る） ---- */
  #stick{position:fixed;z-index:6;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;
    border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);display:none;pointer-events:none}
  #stick.on{display:block}
  #knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,255,255,.45)}

  /* ---- スマホのジャンプボタン ---- */
  #jumpBtn{position:fixed;right:24px;bottom:28px;z-index:6;width:92px;height:92px;border-radius:50%;
    border:2px solid rgba(255,255,255,.5);background:rgba(224,65,58,.55);color:#fff;font:700 16px var(--jp);
    letter-spacing:.1em;display:none;touch-action:none}
  body.touch #jumpBtn{display:block}
  #jumpBtn:active{background:rgba(224,65,58,.85)}

  /* ---- 目的・お知らせ・操作の案内 ---- */
  #obj{position:fixed;left:16px;top:16px;z-index:5;max-width:calc(100vw - 32px);font-size:15px;letter-spacing:.06em;
    background:rgba(8,14,36,.62);border-left:3px solid var(--gold);padding:9px 14px 10px 12px;border-radius:0 4px 4px 0;
    text-shadow:0 1px 6px #000;pointer-events:none;display:none}
  #obj.on{display:block}
  #obj b{display:block;font-size:11px;letter-spacing:.25em;color:var(--gold);font-weight:400;margin-bottom:3px}
  #toast{position:fixed;left:50%;top:30%;z-index:7;transform:translate(-50%,-50%);width:max-content;max-width:90vw;
    font-size:clamp(22px,5vw,40px);font-weight:700;letter-spacing:.08em;text-align:center;
    text-shadow:0 2px 16px rgba(0,0,0,.8);opacity:0;transition:opacity .25s;pointer-events:none}
  #toast.on{opacity:1}
  #prompt{position:fixed;left:50%;bottom:22%;z-index:5;transform:translateX(-50%);font-size:16px;letter-spacing:.1em;
    background:rgba(8,14,36,.7);border:1px solid rgba(255,210,122,.6);padding:8px 16px;border-radius:20px;
    pointer-events:none;display:none;white-space:nowrap}
  #prompt.on{display:block}

  /* ---- スマホの「受け取る」ボタン（ジャンプボタンの左） ---- */
  #actBtn{position:fixed;right:132px;bottom:40px;z-index:6;width:72px;height:72px;border-radius:50%;
    border:2px solid rgba(255,255,255,.5);background:rgba(255,210,122,.45);color:#fff;font:700 14px var(--jp);
    display:none;touch-action:none}
  body.touch #actBtn{display:block}
  #actBtn:active{background:rgba(255,210,122,.8)}

  /* ---- タイム（右上）。左上の目的と重ならないよう目的の幅を詰める ---- */
  #obj{max-width:calc(100vw - 140px)}
  #timer{position:fixed;right:16px;top:16px;z-index:5;font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:.05em;
    background:rgba(8,14,36,.62);padding:6px 12px;border-radius:4px;text-shadow:0 1px 6px #000;pointer-events:none;display:none}
  #timer.on{display:block}

  /* ---- クリア画面 ---- */
  #clear{position:fixed;inset:0;z-index:12;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:16px;text-align:center;background:rgba(8,14,36,.72)}
  #clear.on{display:flex}
  #clear h2{font-size:clamp(28px,6vw,52px);letter-spacing:.08em;color:var(--gold);text-shadow:0 2px 18px rgba(0,0,0,.6)}
  #clear p{font-size:16px;letter-spacing:.12em}
  #clear .time{font-size:22px}
  #clear .time b{font-size:30px;font-variant-numeric:tabular-nums}
  #clearBest{color:var(--gold)}
  #againBtn{margin-top:10px;font:700 18px var(--jp);letter-spacing:.15em;color:#fff;background:var(--red);border:0;
    border-radius:28px;padding:12px 34px;cursor:pointer}
</style>
</head>
<body>
<div id="title">
  <h1>サンタ、<span>ちゃんと</span>届けて</h1>
  <p>クリック / タップで はじめる</p>
  <small>WASD 移動 ・ Space ジャンプ ・ E 受け取る・届ける ・ マウス 視点<br>スマホ：左で移動 ・ 右で視点 ・ 右下のボタン</small>
</div>
<div id="hint">WASD 移動 ／ Space ジャンプ ／ E 受け取る・届ける ／ マウス 視点 ／ Esc でマウスを離す</div>
<div id="stick"><div id="knob"></div></div>
<button id="jumpBtn">ジャンプ</button>
<button id="actBtn">受け取る</button>
<div id="obj"><b>いまやること</b><span id="objText"></span></div>
<div id="toast"></div>
<div id="prompt"></div>
<div id="timer"></div>
<div id="clear">
  <h2>ぜんぶ届けた！</h2>
  <p>メリークリスマス</p>
  <p class="time">タイム <b id="clearTime"></b></p>
  <p id="clearBest"></p>
  <button id="againBtn">もう一度</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
// ===== 数値はすべてここ。遊んでもらいながら調整する =====
const CFG = {
  // サンタの体（位置は足元の中心。単位はメートル）
  santaHalf: 0.4,       // 横幅の半分
  santaHeight: 1.7,

  // 歩き
  walkSpeed: 6,         // 最高速度 m/s
  groundAccel: 40,      // 最高速度へ近づく速さ m/s²（止まるときも同じ）
  stepHeight: 0.35,     // これ以下の段差は歩いて上がれる

  // ジャンプ
  jumpHeight: 14,       // 最高点 m（家の屋根を軽く越える）
  airAccel: 8,          // 空中で速さを変えられる強さ m/s²（地上の 1/5。入力が無ければ勢いが残る）
  jumpBuffer: 0.12,     // 着地のこの秒数前に押したジャンプも受け付ける
  coyoteTime: 0.1,      // 足場から落ちてこの秒数以内ならまだ跳べる

  // 落下
  gravity: 30,          // m/s²
  maxFall: 60,          // 落下速度の上限 m/s
  fallY: -1,            // 足元がこれより下がったら「落ちた」（川・穴）

  // プレゼント
  pickupRange: 2.5,     // そりからこの距離（横）以内なら受け取れる
  dropDelay: 1.4,       // 落としてから、受け取り地点で再開するまでの秒数

  // 配達
  deliverRange: 3,      // 煙突から横にこの距離以内で、軒より上にいれば届けられる（屋根の上でも空中でも）
  beaconMinY: 10,       // 足元がこの高さ以上のときだけ、配達先の光の柱が見える

  // 障害
  snagTime: 0.4,        // 電線に引っかかってから、また引っかかるようになるまでの秒数

  // 理不尽ギミック
  trainDelay: 0.5,      // 列車の屋根に乗ってから走り出すまでの秒数
  trainSpeed: 9,        // 列車の最高速度 m/s
  trainAccel: 5,        // 列車の加速・減速 m/s²
  fleeRange: 12,        // 逃げる家：地上のサンタが家の中心からこの距離以内に来ると逃げる
  fleeSpeed: 4.5,       // 逃げる家の速さ m/s（歩き 6 m/s より少し遅い）

  // カメラ（サンタの後ろ）
  camDist: 7,
  camLookHeight: 1.4,   // 足元からどれだけ上を見るか
  camPitch: 0.35,       // 最初の見下ろし角（ラジアン）
  camPitchMin: -0.15,
  camPitchMax: 1.2,
  camMinDist: 1.2,      // 壁に寄ったときの最短距離
  mouseSens: 0.0025,    // マウス 1px あたりの回転（ラジアン）
  touchSens: 0.006,     // タッチ 1px あたりの回転（ラジアン）

  // 空中のカメラ（着地点が画面に入るように）
  camAirDrop: 0.5,      // 地面からの高さのこの割合だけ、注視点を下げる
  camAirPitch: 0.15,    // 最高点で見下ろし角にこれだけ足す（ラジアン。高さに比例）
  camAirBack: 0.6,      // 地面からの高さ 1m につき、カメラをこれだけ後ろへ引く（サンタと着地点を両方画面に入れる）
  camAirMaxH: 20,       // カメラの引き・注視点の下げは、この高さまでで頭打ち（高い屋上から川へ跳んだとき引きすぎない）
};

// ===== 街の配置 =====
// 5 区画が -Z へ並ぶ。区画の間の地上の道はつながっていない
const COURSE = {
  riverHalf: 7,                          // 1 住宅街 と 2 商店街 の間の凍った川（z = -7〜+7）
  rail: { z0: -47, z1: -69 },            // 2 商店街 と 3 公園 の間の線路の掘割（幅 22m。真ん中に列車）
  train: { h: 4.5, w: 3.2 },             // 掘割の底（-2.5）に止まっている列車。屋根は地面から 2m、奥行き 3.2m
  wall: { z: -116, h: 22, t: 2 },        // 3 公園 と 4 高架下 の間の塀（z = -115〜-117、高さ 22m）
  canyon: { z0: -160, z1: -200 },        // 4 高架下 と 5 最後の家 の間の谷（幅 40m。高架だけが渡っている）
  deck: { h: 18, z0: -140, z1: -208 },   // 高架道路（上面の高さ 18m、x = -5〜5）
  bounds: { x: 40, zMax: 62, zMin: -250 },
  start: { x: 12, z: 50 },               // 歩道の東の雪の上（車道を渡らずにそりへ行ける）
  sleigh: { x: 13, z: 44 },              // プレゼントの受け取り地点（そり）
  respawn: { x: 11, z: 44 },             // 1 軒目を届けるまでに落ちたら戻る場所（そりの横）
  targets: [                             // 配達先の家（中心）。この順に届ける
    { x: -17, z: 30 }, { x: -20, z: -30 }, { x: -24, z: -88 }, { x: -20, z: -130 }, { x: 0, z: -232 },
  ],
  wires: [   // 電線の束（3 本）。ax 方向に a0〜a1、もう一方の座標 c を中心に横 ±0.6m、高さ y。両側の歩道の真上（x = ±9）
              // 当たるとプレゼントを落とす。歩道や車道の端で跳ぶと当たる。車道の真ん中寄りから跳べば当たらない
    { ax: 'z', c: 9, a0: 21, a1: 40, y: 11 },  { ax: 'z', c: -9, a0: 21, a1: 40, y: 11 },     // 1 住宅街
    { ax: 'z', c: 9, a0: -10, a1: -42, y: 11 }, { ax: 'z', c: -9, a0: -10, a1: -42, y: 11 },  // 2 商店街
    { ax: 'z', c: 9, a0: -120, a1: -138, y: 11 }, { ax: 'z', c: -9, a0: -120, a1: -138, y: 11 },  // 4 高架下
  ],
  cars: [    // 走る車。x は固定。at から走り出し、まず z1 の向きへ進み、z0〜z1 を行き来する。車線は x = -5.5, -2, 2, 5.5（1 車線に 1 台）
    { x: -5.5, z0: 58, z1: 12, at: 58, speed: 12, color: 0xf1c40f },      // 1 住宅街
    { x: -2, z0: 58, z1: 12, at: 25, speed: 11, color: 0x3498db },
    { x: 2, z0: 12, z1: 58, at: 40, speed: 12.5, color: 0xe74c3c },
    { x: 5.5, z0: 12, z1: 58, at: 15, speed: 11.5, color: 0xecf0f1 },
    { x: -5.5, z0: -10, z1: -44, at: -10, speed: 12, color: 0xe67e22 },   // 2 商店街
    { x: -2, z0: -10, z1: -44, at: -30, speed: 11, color: 0x1abc9c },
    { x: 2, z0: -44, z1: -10, at: -40, speed: 12.5, color: 0x9b59b6 },
    { x: 5.5, z0: -44, z1: -10, at: -20, speed: 11.5, color: 0xf1c40f },
    { x: -5.5, z0: -120, z1: -157, at: -120, speed: 12, color: 0x8e44ad }, // 4 高架下
    { x: -2, z0: -120, z1: -157, at: -140, speed: 11, color: 0xe74c3c },
    { x: 2, z0: -157, z1: -120, at: -150, speed: 12.5, color: 0x3498db },
    { x: 5.5, z0: -157, z1: -120, at: -125, speed: 11.5, color: 0xecf0f1 },
  ],
  runaway: { x: -24, z: -88, target: 2, bounds: { x0: -34, x1: 34, z0: -108, z1: -76 } },   // 逃げる家（3 軒目）。中心がこの範囲で動く
};
// ===== 当たり判定（three.js に依存しない。verify から直接試す） =====
// 箱は {minX,maxX,minY,maxY,minZ,maxZ}。街の当たり判定はすべてこの箱で表す。
const PHYS = { boxes: [] };
const EPS = 0.001;

// 中心 (cx, cz)、下端 y0、幅 w・高さ h・奥行 d の箱
function makeBox(cx, y0, cz, w, h, d) {
  return { minX: cx - w / 2, maxX: cx + w / 2, minY: y0, maxY: y0 + h, minZ: cz - d / 2, maxZ: cz + d / 2 };
}
function addBox(cx, y0, cz, w, h, d) {
  const b = makeBox(cx, y0, cz, w, h, d);
  PHYS.boxes.push(b);
  return b;
}
function removeBox(b) {
  const i = PHYS.boxes.indexOf(b);
  if (i >= 0) PHYS.boxes.splice(i, 1);
}

// 面が接しているだけなら重なりに数えない
function overlaps(a, b) {
  return a.minX < b.maxX && a.maxX > b.minX &&
         a.minY < b.maxY && a.maxY > b.minY &&
         a.minZ < b.maxZ && a.maxZ > b.minZ;
}
// 足元の位置 p にいるときの体の箱
function bodyBox(p) {
  const r = CFG.santaHalf;
  return { minX: p.x - r, maxX: p.x + r, minY: p.y, maxY: p.y + CFG.santaHeight, minZ: p.z - r, maxZ: p.z + r };
}
function hitAll(p, boxes) {
  const me = bodyBox(p);
  return boxes.filter(b => overlaps(me, b));
}
function hitAny(p, boxes) {
  const me = bodyBox(p);
  for (const b of boxes) if (overlaps(me, b)) return b;
  return null;
}

// 体 {pos, vel, onGround} を dt 秒動かす。重力・壁・段差・着地・天井を処理する。
// 速いときに薄い箱をすり抜けないよう、1回の移動が 0.2m 以下になるよう刻む。
function moveBody(body, dt, boxes) {
  const v = body.vel;
  v.y = Math.max(v.y - CFG.gravity * dt, -CFG.maxFall);
  const far = Math.max(Math.abs(v.x), Math.abs(v.y), Math.abs(v.z)) * dt;
  const n = Math.max(1, Math.ceil(far / 0.2));
  const h = dt / n;
  for (let i = 0; i < n; i++) {
    moveAxisH(body, 'x', v.x * h, boxes);
    moveAxisH(body, 'z', v.z * h, boxes);
    moveAxisY(body, v.y * h, boxes);
  }
  // 足元のすぐ下に箱があれば接地
  body.onGround = v.y <= 0 && !!hitAny({ x: body.pos.x, y: body.pos.y - 0.02, z: body.pos.z }, boxes);
}

// 横（x か z）に d だけ動かす。低い段差なら上に乗り、それ以外は壁の手前で止める。
function moveAxisH(body, ax, d, boxes) {
  if (d === 0) return;
  const p = body.pos;
  p[ax] += d;
  const hits = hitAll(p, boxes);
  if (!hits.length) return;
  const top = Math.max(...hits.map(b => b.maxY));
  if (body.onGround && top - p.y <= CFG.stepHeight) {
    const up = { x: p.x, y: top + EPS, z: p.z };
    if (!hitAny(up, boxes)) { p.y = up.y; return; }
  }
  const r = CFG.santaHalf, A = ax.toUpperCase();
  p[ax] = d > 0 ? Math.min(...hits.map(b => b['min' + A])) - r - EPS
                : Math.max(...hits.map(b => b['max' + A])) + r + EPS;
  body.vel[ax] = 0;
}

// 縦に d だけ動かす。下向きなら、動く前に足元より下にあった面のうち一番高い面に乗る
// （横から箱にめり込んだときに、その箱のてっぺんへ持ち上げられないように）。上向きなら頭を一番低い面で止める。
function moveAxisY(body, d, boxes) {
  if (d === 0) return;
  const p = body.pos, prev = p.y;
  p.y += d;
  const hits = hitAll(p, boxes);
  if (!hits.length) return;
  if (d < 0) {
    const below = hits.filter(b => b.maxY <= prev + 2 * EPS);
    p.y = below.length ? Math.max(...below.map(b => b.maxY)) : prev;
  } else {
    p.y = Math.min(...hits.map(b => b.minY)) - CFG.santaHeight - EPS;
  }
  body.vel.y = 0;
}

// 原点 o から方向 dir（長さ1）へ飛ばした線が箱に当たる距離。当たらなければ Infinity。
// o が箱の中なら 0。
function rayBox(o, dir, b) {
  let tmin = 0, tmax = Infinity;
  for (const ax of ['x', 'y', 'z']) {
    const A = ax.toUpperCase(), lo = b['min' + A], hi = b['max' + A];
    if (Math.abs(dir[ax]) < 1e-9) {
      if (o[ax] < lo || o[ax] > hi) return Infinity;
      continue;
    }
    let t1 = (lo - o[ax]) / dir[ax], t2 = (hi - o[ax]) / dir[ax];
    if (t1 > t2) { const s = t1; t1 = t2; t2 = s; }
    tmin = Math.max(tmin, t1);
    tmax = Math.min(tmax, t2);
    if (tmin > tmax) return Infinity;
  }
  return tmin;
}

// 点 p の真下（x, z が同じ）で、p.y 以下にある一番高い面の高さ。無ければ -Infinity
function groundBelow(p, boxes) {
  let best = -Infinity;
  for (const b of boxes) {
    if (p.x < b.minX || p.x > b.maxX || p.z < b.minZ || p.z > b.maxZ) continue;
    if (b.maxY <= p.y + 0.01 && b.maxY > best) best = b.maxY;
  }
  return best;
}

// 三角屋根の当たり判定。棟は X 方向（長さ len）、斜面は Z 方向（中心から軒先まで hd）。
// 8 段の階段で近似する。1 段は roofH / 8（屋根 2.4m で 0.3m）で、歩いて上がれる高さ以下。
function roofSteps(cx, wallH, cz, len, roofH, hd) {
  const n = 8, out = [];
  for (let i = 0; i < n; i++) out.push(makeBox(cx, wallH, cz, len, roofH * (i + 0.5) / n, hd * 2 * (1 - i / n)));
  return out;
}
// ===== サンタとカメラの操作（three.js に依存しない） =====
function newSanta(x, z) {
  return {
    pos: { x, y: 0, z }, vel: { x: 0, y: 0, z: 0 }, onGround: false, facing: 0,
    jumpBuf: 0,      // 先に押されたジャンプの残り時間
    coyote: 0,       // 足場を離れてもまだ跳べる残り時間
    jumped: false,   // 跳んだ瞬間に立つ（音を鳴らしたら呼ぶ側が下ろす）
    landSpeed: 0,    // 着地した瞬間の落ちる速さ（使ったら呼ぶ側が 0 に戻す）
  };
}

// カメラの向き yaw（0 で -Z を向く）から見た「前」と「右」
function camAxes(yaw) {
  return { fx: -Math.sin(yaw), fz: -Math.cos(yaw), rx: Math.cos(yaw), rz: -Math.sin(yaw) };
}

// 速度 (vx, vz) を目標 (tx, tz) へ、最大 k だけ近づける
function approachVec(vx, vz, tx, tz, k) {
  const ex = tx - vx, ez = tz - vz, e = Math.hypot(ex, ez);
  if (e <= k) return [tx, tz];
  return [vx + ex / e * k, vz + ez / e * k];
}

// 最高点がちょうど jumpHeight になる初速
function jumpSpeed() {
  return Math.sqrt(2 * CFG.gravity * CFG.jumpHeight);
}

// 入力 {x: 右が+, z: 前が+（各 -1〜1）, jump: 押した瞬間だけ true} とカメラの向き yaw で、サンタを dt 秒動かす
function santaStep(s, input, yaw, dt, boxes) {
  const a = camAxes(yaw);
  let dx = a.rx * input.x + a.fx * input.z;
  let dz = a.rz * input.x + a.fz * input.z;
  const len = Math.hypot(dx, dz);
  if (len > 1) { dx /= len; dz /= len; }
  // 地上はすぐ思った速さになる。空中は弱くしか効かず、入力が無ければ勢いがそのまま残る
  if (s.onGround) {
    [s.vel.x, s.vel.z] = approachVec(s.vel.x, s.vel.z, dx * CFG.walkSpeed, dz * CFG.walkSpeed, CFG.groundAccel * dt);
  } else if (len > 0.1) {
    [s.vel.x, s.vel.z] = approachVec(s.vel.x, s.vel.z, dx * CFG.walkSpeed, dz * CFG.walkSpeed, CFG.airAccel * dt);
  }
  if (len > 0.1) s.facing = Math.atan2(-dx, -dz);   // 見た目の正面は -Z

  // ジャンプ。着地の少し前に押しても、足場から落ちた直後に押しても跳べる
  s.jumpBuf = input.jump ? CFG.jumpBuffer : Math.max(0, s.jumpBuf - dt);
  s.coyote = s.onGround ? CFG.coyoteTime : Math.max(0, s.coyote - dt);
  if (s.jumpBuf > 0 && s.coyote > 0) {
    s.vel.y = jumpSpeed();
    s.jumpBuf = 0;
    s.coyote = 0;
    s.onGround = false;
    s.jumped = true;
  }

  const wasGround = s.onGround, vy = s.vel.y;
  moveBody(s, dt, boxes);
  if (s.onGround && !wasGround) s.landSpeed = Math.max(0, -vy);
}

// カメラを置く場所。target から yaw の後ろ・pitch の高さへ camDist 離す。
// 間に箱があれば、その 0.3m 手前まで寄せる（ただし camMinDist より近づけない）。
// want を渡すと camDist の代わりにその距離を目指す（空中で引くとき）。
function cameraPlace(target, yaw, pitch, boxes, want) {
  const cp = Math.cos(pitch);
  const dir = { x: Math.sin(yaw) * cp, y: Math.sin(pitch), z: Math.cos(yaw) * cp };
  let dist = want || CFG.camDist;
  for (const b of boxes) {
    if (b.noCam) continue;
    const t = rayBox(target, dir, b);
    if (t - 0.3 < dist) dist = t - 0.3;
  }
  dist = Math.max(CFG.camMinDist, dist);
  return { x: target.x + dir.x * dist, y: target.y + dir.y * dist, z: target.z + dir.z * dist, dist, dir };
}
// ===== 配達の進み具合（three.js に依存しない） =====
// state: 'play'（ふつう）／'dropped'（プレゼントを落とした。dropDelay 秒後に受け取り地点から再開）
// targets: 配達先の煙突 {x, y, z, front} を届ける順に並べたもの。front は「その家の前」（届けた後に落としたら戻る場所）
function newRun(targets) {
  return {
    carrying: false, state: 'play', timer: 0, drops: 0,
    targets: targets || [], target: 0,   // target: 次に届ける煙突の番号
    respawn: null,                       // 落としたときに戻る場所（null なら最初のそりの横）
    time: 0, cleared: false,
  };
}

// 受け取り地点 p の近く（横 pickupRange 以内、高さ 2m 未満）にいるか
function nearPickup(s, p) {
  return Math.hypot(s.pos.x - p.x, s.pos.z - p.z) <= CFG.pickupRange && Math.abs(s.pos.y - (p.y || 0)) < 2;
}

// E を押したとき。受け取れたら true
function tryPickup(run, s, p) {
  if (run.cleared || run.state !== 'play' || run.carrying || !nearPickup(s, p)) return false;
  run.carrying = true;
  return true;
}

// サンタを場所 p に置き直す（勢いも消す）
function placeAt(s, p) {
  s.pos = { x: p.x, y: p.y || 0, z: p.z };
  s.vel = { x: 0, y: 0, z: 0 };
  s.onGround = false;
  s.jumpBuf = 0;
  s.coyote = 0;
}

// プレゼントを落とす。川に落ちたときのほか、Phase 5〜6 のギミックからも呼ぶ。落としたら true
function dropPresent(run) {
  if (!run.carrying || run.state !== 'play') return false;
  run.carrying = false;
  run.state = 'dropped';
  run.timer = CFG.dropDelay;
  run.drops++;
  return true;
}

// 毎フレーム呼ぶ。返り値は起きたこと:
// 'dropped'（持ったまま落ちた）／'fell'（持たずに落ちた。すぐ戻した）／'respawn'（落とした後、受け取り地点に戻した）／null
function stepRun(run, s, dt, respawn) {
  if (run.state === 'dropped') {
    run.timer -= dt;
    if (run.timer > 0) return null;
    placeAt(s, run.respawn || respawn);
    run.state = 'play';
    run.carrying = true;   // 受け取り地点から、プレゼントを持った状態でやり直し
    return 'respawn';
  }
  if (s.pos.y >= CFG.fallY) return null;
  if (dropPresent(run)) return 'dropped';
  placeAt(s, run.respawn || respawn);
  return 'fell';
}


// 煙突 ch の近くにいて届けられるか。横 deliverRange 以内で、足元が軒（ch.base）より上。
// 屋根の上に立っていても、煙突の上を飛んでいる途中でもよい（煙突の上に乗るのは難しすぎたため）
function nearChimney(s, ch) {
  return Math.hypot(s.pos.x - ch.x, s.pos.z - ch.z) <= CFG.deliverRange && s.pos.y >= ch.base;
}

// E を押したとき。chimneys は街のすべての煙突。
// 返り値: 'delivered'（届けた）／'cleared'（最後の 1 軒を届けた）／'wrong'（ほかの家の煙突）／null（何も起きない）
function tryDeliver(run, s, chimneys) {
  if (run.state !== 'play' || !run.carrying || run.cleared) return null;
  // 配達先の煙突が近ければそちらを優先（隣の家の煙突も近いときに wrong にしない）
  const goal = run.targets[run.target];
  const ch = goal && nearChimney(s, goal) ? goal : chimneys.find(c => nearChimney(s, c));
  if (!ch) return null;
  if (ch !== goal) return 'wrong';
  run.target++;
  run.respawn = ch.front;
  if (run.target >= run.targets.length) {
    run.cleared = true;
    run.carrying = false;
    return 'cleared';
  }
  return 'delivered';   // 背中の袋から次のプレゼントを出すので、持ったまま
}

// タイム。クリアしたら止まる
function tickTime(run, dt) {
  if (!run.cleared) run.time += dt;
}

// 自己ベスト best（無ければ null）と今回のタイム time から、新しいベストと更新したかを返す
function bestAfter(best, time) {
  if (best === null || time < best) return { best: time, isNew: true };
  return { best, isNew: false };
}

// 秒を「分:秒.1桁」に（83.42 → '1:23.4'）。0.1 秒未満は切り捨て（59.96 が '0:60.0' にならないように）
function fmtTime(sec) {
  const tenths = Math.floor(sec * 10);
  const m = Math.floor(tenths / 600), s = (tenths - m * 600) / 10;
  return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1);
}
// ===== 障害：電線と走る車（three.js に依存しない） =====

// 電線の束 w に体が当たっているか。w は ax 方向（'x' か 'z'）に a0〜a1、もう一方の座標 c を中心に横 ±0.6m（3 本）、高さ y
function wireHit(s, w) {
  const r = CFG.santaHalf, o = w.ax === 'x' ? 'z' : 'x';
  if (s.pos[w.ax] + r < Math.min(w.a0, w.a1) || s.pos[w.ax] - r > Math.max(w.a0, w.a1)) return false;
  if (Math.abs(s.pos[o] - w.c) > r + 0.6) return false;
  return s.pos.y < w.y + 0.1 && s.pos.y + CFG.santaHeight > w.y - 0.1;
}

// 毎フレーム呼ぶ。空中で電線に当たったら、前へ進む勢いが逆向きに 1/4 になり、真下へ落ち始める。
// 引っかかったら true。引っかかってから snagTime 秒は二度当たらない（落ちる途中でまた当たらないように）
function checkWires(s, wires, dt) {
  if (s.snag > 0) { s.snag -= dt; return false; }
  if (s.onGround) return false;
  for (const w of wires) {
    if (!wireHit(s, w)) continue;
    s.vel.x *= -0.25;
    s.vel.z *= -0.25;
    s.vel.y = Math.min(s.vel.y, 0) - 3;
    s.snag = CFG.snagTime;
    w.shake = 1;   // 見た目で電線を揺らす
    return true;
  }
  return false;
}

// 走る車。x は固定。at（省略なら z0）から走り出し、まず z1 の向きへ進み、z0〜z1 を行き来する。
// boxes は当たり判定（[0] 車体、[1] 屋根）。PHYS.boxes にも入れて動かすので、サンタが屋根に着地できる
function newCar(x, z0, z1, speed, at) {
  const z = at === undefined ? z0 : at;
  return {
    x, z, z0, z1, speed, dir: z1 > z0 ? 1 : -1,
    boxes: [makeBox(x, 0.35, z, 1.9, 0.9, 4.2), makeBox(x, 1.25, z, 1.7, 0.75, 2.3)],
  };
}

function setBoxZ(b, z) {
  const h = (b.maxZ - b.minZ) / 2;
  b.minZ = z - h;
  b.maxZ = z + h;
}

// 車を dt 秒動かし、動いた距離を返す。端で折り返す
function moveCar(c, dt) {
  const lo = Math.min(c.z0, c.z1), hi = Math.max(c.z0, c.z1);
  let z = c.z + c.dir * c.speed * dt;
  if (z > hi) { z = hi; c.dir = -1; }
  else if (z < lo) { z = lo; c.dir = 1; }
  const dz = z - c.z;
  c.z = z;
  for (const b of c.boxes) setBoxZ(b, z);
  return dz;
}

// 車を動かし、サンタとの関わりを返す。'ride'（屋根の上にいて、いっしょに動いた）／'hit'（はねられた）／null
// boxes を渡すと、運ぶときに壁などで止まる（渡さなければ位置をそのままずらす）
function updateCar(c, s, dt, boxes) {
  const roof = c.boxes[1], me0 = bodyBox(s.pos);
  const riding = s.onGround && Math.abs(s.pos.y - roof.maxY) < 0.05 &&
    me0.maxX > roof.minX && me0.minX < roof.maxX && me0.maxZ > roof.minZ && me0.minZ < roof.maxZ;
  const dz = moveCar(c, dt);
  if (riding) { carry(s, 'z', dz, boxes); return 'ride'; }
  const me = bodyBox(s.pos);
  if (!c.boxes.some(b => overlaps(me, b))) return null;
  // ほぼ屋根の高さから来たなら、屋根に乗せるだけ
  if (s.pos.y >= roof.maxY - 0.5) {
    s.pos.y = roof.maxY;
    if (s.vel.y < 0) s.vel.y = 0;
    return null;
  }
  // はねられる：車から離れる横向きと、車の進む向きへ飛ばされる
  const side = s.pos.x >= c.x ? 1 : -1, body = c.boxes[0];
  s.pos.x = side > 0 ? Math.max(s.pos.x, body.maxX + CFG.santaHalf + EPS) : Math.min(s.pos.x, body.minX - CFG.santaHalf - EPS);
  s.vel.x = side * 5;
  s.vel.z = c.dir * 9;
  s.vel.y = 9;
  s.onGround = false;
  return 'hit';
}

// ===== 理不尽ギミック：動き出す列車・逃げる家 =====

// 足元のすぐ下が boxes のどれかに乗っているか
function standingOn(s, boxes) {
  if (!s.onGround) return false;
  const me = bodyBox({ x: s.pos.x, y: s.pos.y - 0.02, z: s.pos.z });
  return boxes.some(b => overlaps(me, b));
}

// 掘割の底に止まっている列車。xs は車両の中心、len は車両の長さ、y0 は底、h は高さ。
// span ごとに x が一周する（x が span/2 を越えた車両は反対側へ回る）
function newTrain(xs, zc, len, w, y0, h, span) {
  return { cars: xs.map(x => ({ x, box: makeBox(x, y0, zc, len, h, w) })), span, zc, w, speed: 0, ride: 0 };
}

function setBoxX(b, x) {
  const hw = (b.maxX - b.minX) / 2;
  b.minX = x - hw;
  b.maxX = x + hw;
}

// 列車全体を +X へ dx 動かす
function shiftTrain(tr, dx) {
  for (const c of tr.cars) {
    c.x += dx;
    if (c.x > tr.span / 2) c.x -= tr.span;
    setBoxX(c.box, c.x);
  }
}

// 列車を動かす。サンタが屋根に乗って trainDelay 秒たつと走り出し（trainSpeed まで加速）、降りると止まる。
// 乗っていればサンタもいっしょに運ぶ。返り値: 'start'（走り出した瞬間）／'ride'（乗っている）／'scraped'（トンネルの入口にぶつかって落ちた）／null
// boxes を渡すと、運ぶときに壁で止まる（街の端で止められたら、トンネルの入口にぶつかったことにして線路へはじき出す）
function updateTrain(tr, s, dt, boxes) {
  const riding = standingOn(s, tr.cars.map(c => c.box));
  tr.ride = riding ? tr.ride + dt : 0;
  const want = riding && tr.ride >= CFG.trainDelay ? CFG.trainSpeed : 0;
  const was = tr.speed;
  tr.speed = want > tr.speed ? Math.min(want, tr.speed + CFG.trainAccel * dt)
                             : Math.max(want, tr.speed - CFG.trainAccel * dt);
  const dx = tr.speed * dt;
  if (dx) shiftTrain(tr, dx);
  if (riding) {
    const x0 = s.pos.x;
    carry(s, 'x', dx, boxes);
    // 街の端（トンネルの入口）で止められた：入口にぶつかって、列車の横から線路へ落ちる
    if (dx > 0 && s.pos.x < x0 + dx - 1e-6) { knockOffTrain(s, tr); return 'scraped'; }
  }
  if (was === 0 && tr.speed > 0) return 'start';
  return riding ? 'ride' : null;
}

// 逃げる家。boxes はその家の当たり判定の箱すべて、chimney は W.houses の煙突（front も含めていっしょに動かす）
function newRunaway(x, z, boxes, chimney, bounds) {
  return { x, z, x0: x, z0: z, boxes, chimney, bounds, caught: false, fleeing: false };
}

function moveRunaway(h, mx, mz) {
  h.x += mx;
  h.z += mz;
  for (const b of h.boxes) { b.minX += mx; b.maxX += mx; b.minZ += mz; b.maxZ += mz; }
  h.chimney.x += mx;
  h.chimney.z += mz;
  h.chimney.front.x += mx;
  h.chimney.front.z += mz;
}

// 家を逃がす。active（その家がいまの配達先）で、地上のサンタが fleeRange 以内なら、離れる向きに fleeSpeed で逃げる。
// 空中のサンタからは逃げない（上は見ていない）。屋根に乗られたら caught。返り値: 'flee'／'caught'（つかまった瞬間）／null
function stepRunaway(h, s, dt, active) {
  h.fleeing = false;
  if (h.caught || !active) return null;
  if (standingOn(s, h.boxes)) { h.caught = true; return 'caught'; }
  if (!s.onGround) return null;
  const dx = h.x - s.pos.x, dz = h.z - s.pos.z, d = Math.hypot(dx, dz);
  if (d > CFG.fleeRange || d < 1e-6) return null;
  const B = h.bounds, step = CFG.fleeSpeed * dt;
  const nx = Math.min(B.x1, Math.max(B.x0, h.x + dx / d * step));
  const nz = Math.min(B.z1, Math.max(B.z0, h.z + dz / d * step));
  moveRunaway(h, nx - h.x, nz - h.z);
  h.fleeing = true;
  return 'flee';
}

// 「もう一度」のとき、元の場所に戻す
function resetRunaway(h) {
  moveRunaway(h, h.x0 - h.x, h.z0 - h.z);
  h.caught = false;
  h.fleeing = false;
}

// 乗り物がサンタを ax 方向に d 運ぶ。boxes があれば通常の横移動と同じく壁で止まる。
// 位置を直接ずらすと見えない壁などにめり込むため（めり込んだまま落ちる処理が走ると、壁のてっぺんに持ち上げられていた）
function carry(s, ax, d, boxes) {
  if (boxes) moveAxisH(s, ax, d, boxes);
  else s.pos[ax] += d;
}

// トンネルの入口にぶつかったサンタを、列車の横（線路の上）へはじき出す。そのまま線路に落ちる
function knockOffTrain(s, tr) {
  s.pos.z = tr.zc + tr.w / 2 + CFG.santaHalf + 0.2;
  s.vel = { x: -2, y: 4, z: 2 };
  s.onGround = false;
  tr.ride = 0;
}
// ===== 音（Web Audio で自作。ファイルは使わない） =====
const SND = { ctx: null, out: null, noise: null };

// 最初のクリック・タップで呼ぶ（ブラウザは操作前に音を出させない）
function sndInit() {
  if (SND.ctx) return;
  try { SND.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  const c = SND.ctx;
  SND.out = c.createGain();
  SND.out.gain.value = 0.7;
  SND.out.connect(c.destination);
  const buf = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  SND.noise = buf;

  // 風：ノイズを低くこもらせ、ゆっくり強弱をつけて流し続ける
  const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
  const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 380;
  const g = c.createGain(); g.gain.value = 0.06;
  const lfo = c.createOscillator(); lfo.frequency.value = 0.08;
  const lg = c.createGain(); lg.gain.value = 0.04;
  lfo.connect(lg); lg.connect(g.gain);
  src.connect(lp); lp.connect(g); g.connect(SND.out);
  src.start(); lfo.start();
}

// 雪を踏む「ザクッ」
function sndStep() {
  const c = SND.ctx;
  if (!c) return;
  const t = c.currentTime;
  const src = c.createBufferSource(); src.buffer = SND.noise;
  const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100 + Math.random() * 700; bp.Q.value = 1.1;
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.35, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
  src.connect(bp); bp.connect(g); g.connect(SND.out);
  src.start(t, Math.random() * 1.5, 0.14);
}

// ジャンプ「ボヨーン」（音程が上がる）
function sndJump() {
  const c = SND.ctx;
  if (!c) return;
  const t = c.currentTime;
  const o = c.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(220, t);
  o.frequency.exponentialRampToValueAtTime(700, t + 0.22);
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
  o.connect(g); g.connect(SND.out);
  o.start(t); o.stop(t + 0.32);
}

// 着地「ドスッ」。power は 0〜1（高いところから落ちたほど大きい）
function sndLand(power) {
  const c = SND.ctx;
  if (!c) return;
  const t = c.currentTime;
  const o = c.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(110, t);
  o.frequency.exponentialRampToValueAtTime(40, t + 0.18);
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.5 * power + 0.05, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
  o.connect(g); g.connect(SND.out);
  o.start(t); o.stop(t + 0.25);
  const src = c.createBufferSource(); src.buffer = SND.noise;
  const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
  const g2 = c.createGain();
  g2.gain.setValueAtTime(0.0001, t);
  g2.gain.exponentialRampToValueAtTime(0.4 * power + 0.05, t + 0.01);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
  src.connect(lp); lp.connect(g2); g2.connect(SND.out);
  src.start(t, Math.random() * 1.5, 0.18);
}

// 単音。freqEnd を渡すとその音程まで滑る
function sndTone(freq, t0, dur, type, vol, freqEnd) {
  const c = SND.ctx;
  const o = c.createOscillator(); o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t0 + dur);
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(SND.out);
  o.start(t0); o.stop(t0 + dur + 0.02);
}

// 受け取り「ピロリン」
function sndPickup() {
  const c = SND.ctx;
  if (!c) return;
  const t = c.currentTime;
  sndTone(988, t, 0.15, 'sine', 0.2);
  sndTone(1319, t + 0.1, 0.25, 'sine', 0.2);
}

// 落とした「ヒュ〜〜」（音程が下がる）
function sndDrop() {
  const c = SND.ctx;
  if (!c) return;
  sndTone(700, c.currentTime, 0.7, 'triangle', 0.22, 110);
}

// 届けた「シャラララン」（上がっていく 4 音）
function sndDeliver() {
  const c = SND.ctx;
  if (!c) return;
  const t = c.currentTime;
  [1047, 1319, 1568, 2093].forEach((f, i) => sndTone(f, t + i * 0.08, 0.35, 'sine', 0.16));
}

// 違う家「ブブッ」
function sndWrong() {
  const c = SND.ctx;
  if (!c) return;
  const t = c.currentTime;
  sndTone(180, t, 0.12, 'square', 0.08);
  sndTone(150, t + 0.13, 0.18, 'square', 0.08);
}

// クリアのファンファーレ
function sndClear() {
  const c = SND.ctx;
  if (!c) return;
  const t = c.currentTime;
  [784, 988, 1175, 1568, 1319, 1568].forEach((f, i) => sndTone(f, t + i * 0.14, i === 5 ? 0.9 : 0.3, 'triangle', 0.18));
}

// 電線「ビヨーン」（音程が揺れながら下がる）
function sndBoing() {
  const c = SND.ctx;
  if (!c) return;
  const t = c.currentTime;
  const o = c.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(260, t);
  o.frequency.exponentialRampToValueAtTime(120, t + 0.5);
  const lfo = c.createOscillator(); lfo.frequency.value = 18;
  const lg = c.createGain(); lg.gain.value = 60;
  lfo.connect(lg); lg.connect(o.frequency);
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
  o.connect(g); g.connect(SND.out);
  o.start(t); lfo.start(t);
  o.stop(t + 0.6); lfo.stop(t + 0.6);
}

// クラクション「プップー」
function sndHonk() {
  const c = SND.ctx;
  if (!c) return;
  const t = c.currentTime;
  for (const f of [440, 554]) {
    sndTone(f, t, 0.12, 'square', 0.08);
    sndTone(f, t + 0.16, 0.3, 'square', 0.08);
  }
}

// 汽笛「ポーッ」（3 つの音を重ねる）
function sndWhistle() {
  const c = SND.ctx;
  if (!c) return;
  const t = c.currentTime;
  for (const f of [587, 740, 880]) sndTone(f, t, 0.9, 'triangle', 0.07);
}

// 家が逃げる足音「トコトコトコ」
function sndScurry() {
  const c = SND.ctx;
  if (!c) return;
  const t = c.currentTime;
  for (let i = 0; i < 8; i++) sndTone(i % 2 ? 660 : 520, t + i * 0.07, 0.06, 'square', 0.06);
}
// ===== 街（見た目と当たり判定を一緒に作る） =====
const W = { scene: null, houses: [], snow: null };

const COL = {
  snow: 0xe4ebf5, road: 0x3b4356, walk: 0xbfc8d8, roof: 0xe8eef8,
  brick: 0x8a4a3a, brickTop: 0x6e3a2e, trunk: 0x5a3a28, leaf: 0x2f6b4a,
  glass: 0xffc56e, door: 0x5b3524, far: 0x18213a,
};
const LIGHT_COLORS = [0xff4d4d, 0x4dff88, 0x4da6ff, 0xffd84d, 0xff8de8];

const MATS = {};
function mat(color, emissive) {
  const k = color + '/' + (emissive || 0);
  if (!MATS[k]) MATS[k] = new THREE.MeshLambertMaterial({ color, emissive: emissive || 0 });
  return MATS[k];
}
// 見た目だけ置く
function deco(geo, material, x, y, z) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  W.scene.add(m);
  return m;
}
// 見た目の箱と当たり判定の箱を同じ寸法で置く
function solid(cx, y0, cz, w, h, d, material) {
  addBox(cx, y0, cz, w, h, d);
  return deco(new THREE.BoxGeometry(w, h, d), material, cx, y0 + h / 2, cz);
}
// 色付きの点（イルミネーション）
const LIGHT_MAT = new THREE.PointsMaterial({ size: 0.28, vertexColors: true });
function addLights(pts, cols) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  W.scene.add(new THREE.Points(g, LIGHT_MAT));
}

// 家。棟（屋根のてっぺん）は X 方向に通る。y0 は土台の高さ（崖の上の家など。省略で 0）。
// 屋根の見た目は三角、当たり判定は 8 段の階段（乗った足と斜面のずれは 0.15m 以内、1段は stepHeight 以下）。
function house(cx, cz, w, d, wallH, wallColor, y0) {
  y0 = y0 || 0;
  const top = y0 + wallH;   // 軒の高さ
  solid(cx, y0, cz, w, wallH, d, mat(wallColor));

  const over = 0.4, hd = d / 2 + over, len = w + over * 2;
  const roofH = Math.min(2.4, d * 0.35);
  const shape = new THREE.Shape();
  shape.moveTo(-hd, 0); shape.lineTo(hd, 0); shape.lineTo(0, roofH); shape.closePath();
  const g = new THREE.ExtrudeGeometry(shape, { depth: len, bevelEnabled: false });
  g.translate(0, 0, -len / 2);
  const roof = deco(g, mat(COL.roof), cx, top, cz);
  roof.rotation.y = Math.PI / 2;
  for (const b of roofSteps(cx, top, cz, len, roofH, hd)) PHYS.boxes.push(b);

  // 煙突（配達先になる）
  const chH = roofH + 1.0, chX = cx + w * 0.25, chZ = cz + d * 0.18;
  solid(chX, top, chZ, 0.9, chH, 0.9, mat(COL.brick));
  solid(chX, top + chH, chZ, 1.1, 0.2, 1.1, mat(COL.brickTop));

  // 窓（明かりがついている）とドア
  const floors = wallH >= 5.5 ? [1.5, 4.2] : [1.6];
  for (const fy of floors) for (const fx of [-w * 0.25, w * 0.25]) for (const side of [1, -1]) {
    const win = deco(new THREE.PlaneGeometry(1.1, 1.2), mat(0x000000, COL.glass), cx + fx, y0 + fy, cz + side * (d / 2 + 0.02));
    if (side < 0) win.rotation.y = Math.PI;
  }
  deco(new THREE.PlaneGeometry(1.1, 2.0), mat(COL.door), cx, y0 + 1.0, cz + d / 2 + 0.03);

  // 軒先のイルミネーション
  const pts = [], cols = [], c = new THREE.Color();
  let k = 0;
  for (const side of [1, -1]) for (let x = -len / 2; x <= len / 2; x += 0.6) {
    pts.push(cx + x, top - 0.05, cz + side * (hd - 0.05));
    c.setHex(LIGHT_COLORS[k++ % LIGHT_COLORS.length]);
    cols.push(c.r, c.g, c.b);
  }
  addLights(pts, cols);

  W.houses.push({ x: cx, z: cz, w, d, wallH,
    chimney: { x: chX, y: top + chH + 0.2, z: chZ, base: top, front: { x: cx, y: y0, z: cz + d / 2 + 2.5 } } });
}

// 車。alongX なら X 方向に長い。屋根に乗れる。
function car(cx, cz, alongX, color) {
  const L = 4.2, Wd = 1.9;
  solid(cx, 0.35, cz, alongX ? L : Wd, 0.9, alongX ? Wd : L, mat(color));
  solid(cx, 1.25, cz, alongX ? 2.3 : 1.7, 0.75, alongX ? 1.7 : 2.3, mat(0x2a3140));
  deco(new THREE.BoxGeometry(alongX ? 2.2 : 1.6, 0.08, alongX ? 1.6 : 2.2), mat(COL.snow), cx, 2.04, cz);
  const wg = new THREE.CylinderGeometry(0.36, 0.36, 0.3, 12);
  for (const a of [-1, 1]) for (const b of [-1, 1]) {
    const wh = deco(wg, mat(0x15171c), cx + (alongX ? a * 1.35 : b * 0.85), 0.36, cz + (alongX ? b * 0.85 : a * 1.35));
    if (alongX) wh.rotation.x = Math.PI / 2; else wh.rotation.z = Math.PI / 2;
  }
}

// 木。当たり判定は幹だけ。
function tree(x, z, s) {
  solid(x, 0, z, 0.4 * s, 1.2 * s, 0.4 * s, mat(COL.trunk));
  deco(new THREE.ConeGeometry(1.6 * s, 2.4 * s, 8), mat(COL.leaf), x, 2.2 * s, z);
  deco(new THREE.ConeGeometry(1.2 * s, 2.0 * s, 8), mat(COL.leaf), x, 3.4 * s, z);
  deco(new THREE.ConeGeometry(0.55 * s, 0.6 * s, 8), mat(COL.snow), x, 4.25 * s, z);
}

// 広場の大きなクリスマスツリー
function xmasTree(x, z) {
  const s = 2.2;
  tree(x, z, s);
  deco(new THREE.OctahedronGeometry(0.6), mat(0xffd84d, 0xffb300), x, 4.55 * s + 0.4, z);
  const pts = [], cols = [], c = new THREE.Color();
  for (let i = 0; i < 140; i++) {
    const t = i / 140, a = i * 0.9, r = (1 - t) * 3.4 + 0.25;
    pts.push(x + Math.cos(a) * r, 2.2 + t * 7.4, z + Math.sin(a) * r);
    c.setHex(LIGHT_COLORS[i % LIGHT_COLORS.length]);
    cols.push(c.r, c.g, c.b);
  }
  addLights(pts, cols);
}

// 街灯。light が true のときだけ点光源を付ける（点光源は描画が重いので、区画に 1 本ずつ）
function lamp(x, z, light) {
  solid(x, 0, z, 0.2, 4.6, 0.2, mat(0x2b2f3a));
  deco(new THREE.SphereGeometry(0.3, 12, 8), mat(0x000000, 0xffd7a0), x, 4.75, z);
  if (!light) return;
  const L = new THREE.PointLight(0xffc98a, 1.4, 18, 2);
  L.position.set(x, 4.5, z);
  W.scene.add(L);
}

// 平屋根の高い建物（マンション・ビル）。地面から一気には届かない高さにして、段を登らせる。
// 窓は階ごと（3m おき）に四面へ並べ、明かりはところどころ。
function building(cx, cz, w, d, h, color) {
  solid(cx, 0, cz, w, h, d, mat(color));
  deco(new THREE.BoxGeometry(w + 0.2, 0.15, d + 0.2), mat(COL.roof), cx, h + 0.07, cz);   // 屋上の雪
  solid(cx + w * 0.25, h, cz - d * 0.2, 2, 2, 2, mat(0x8a93a6));                           // 給水タンク
  const lit = mat(0x000000, COL.glass), dark = mat(0x1d2436);
  const geo = new THREE.PlaneGeometry(1.2, 1.4);
  let k = 0;
  for (let fy = 1.6; fy < h - 1; fy += 3) {
    for (let side = 0; side < 4; side++) {
      const along = side < 2 ? w : d;
      for (let u = -along / 2 + 1.5; u <= along / 2 - 1.5; u += 2.5) {
        const p = deco(geo, (k++ * 7) % 5 < 3 ? lit : dark, 0, 0, 0);
        if (side === 0) p.position.set(cx + u, fy, cz + d / 2 + 0.02);
        else if (side === 1) { p.position.set(cx + u, fy, cz - d / 2 - 0.02); p.rotation.y = Math.PI; }
        else if (side === 2) { p.position.set(cx + w / 2 + 0.02, fy, cz + u); p.rotation.y = Math.PI / 2; }
        else { p.position.set(cx - w / 2 - 0.02, fy, cz + u); p.rotation.y = -Math.PI / 2; }
      }
    }
  }
}

// そり（プレゼントの受け取り地点）。当たり判定なし（中に入って受け取れる）
function sleigh(x, z) {
  const red = mat(0xc0392b), gold = mat(0xffd84d, 0x5a4000);
  deco(new THREE.BoxGeometry(1.6, 0.7, 2.8), red, x, 0.75, z);              // 車体
  deco(new THREE.BoxGeometry(1.6, 0.9, 0.3), red, x, 1.25, z + 1.3);        // 背もたれ
  for (const sx of [-0.7, 0.7]) {
    deco(new THREE.BoxGeometry(0.12, 0.12, 3.4), gold, x + sx, 0.12, z - 0.1);   // 刃
    for (const sz of [-1, 1]) deco(new THREE.BoxGeometry(0.1, 0.35, 0.1), gold, x + sx, 0.3, z + sz);   // 脚
  }
  // 積まれたプレゼント
  const cols = [0x2f9e57, 0x3a7bd5, 0xffd84d, 0xd8322c, 0x9b59b6];
  for (let i = 0; i < 5; i++) {
    deco(new THREE.BoxGeometry(0.5, 0.5, 0.5), mat(cols[i]),
      x + (i % 2 ? 0.35 : -0.35), 1.35 + Math.floor(i / 2) * 0.45, z - 0.6 + (i % 3) * 0.4);
  }
  // 足元の光の輪（受け取れる範囲の目安）とやわらかい明かり
  const ring = deco(new THREE.RingGeometry(2.0, 2.3, 40),
    new THREE.MeshBasicMaterial({ color: 0xffd27a, transparent: true, opacity: 0.6 }), x, 0.03, z);
  ring.rotation.x = -Math.PI / 2;
  const L = new THREE.PointLight(0xffd27a, 1.0, 10, 2);
  L.position.set(x, 2.5, z);
  W.scene.add(L);
}

// 地面の切れ目（川・線路・谷）。z0〜z1 には地面が無い。底 bedY に当たり判定の底を置く
// （落ちると fallY でやり直しになるので底に立つことはない。底は空中の目印とカメラが働くため）
function cut(z0, z1, bedY, bedMat) {
  const zc = (z0 + z1) / 2, d = Math.abs(z1 - z0), hiZ = Math.max(z0, z1), loZ = Math.min(z0, z1);
  addBox(0, bedY - 3.5, zc, 200, 3.5, d);
  const bed = deco(new THREE.PlaneGeometry(200, d), bedMat, 0, bedY, zc);
  bed.rotation.x = -Math.PI / 2;
  // 両岸の石垣（切れ目の側を向く）
  const a = deco(new THREE.PlaneGeometry(200, -bedY), mat(0x55586a), 0, bedY / 2, hiZ - 0.01);
  a.rotation.y = Math.PI;
  deco(new THREE.PlaneGeometry(200, -bedY), mat(0x55586a), 0, bedY / 2, loZ + 0.01);
}

// z0〜z1 の車道（x = -8〜8、4 車線）と両側の歩道（x = ±8〜10、高さ 0.15m）
function road(z0, z1) {
  const zc = (z0 + z1) / 2, d = Math.abs(z1 - z0);
  const r = deco(new THREE.PlaneGeometry(16, d), mat(COL.road), 0, 0.01, zc);
  r.rotation.x = -Math.PI / 2;
  for (const lx of [-3.75, 0, 3.75]) {   // 車線の白線（見た目だけ）
    const ln = deco(new THREE.PlaneGeometry(0.15, d), mat(0x9aa3b5), lx, 0.015, zc);
    ln.rotation.x = -Math.PI / 2;
  }
  solid(9, 0, zc, 2, 0.15, d, mat(COL.walk));
  solid(-9, 0, zc, 2, 0.15, d, mat(COL.walk));
}

// 通行止めの柵（車道の端。歩いては出られない。跳べば越えられる）
function barrier(z) {
  solid(0, 0, z, 16, 1.0, 0.3, mat(0xe0913a));
}

// 商店街の店。平屋根で、道路側（x = 0 の側）に明るいショーウィンドウ・看板・ひさし
function shop(cx, cz, w, d, h, color, signColor) {
  solid(cx, 0, cz, w, h, d, mat(color));
  deco(new THREE.BoxGeometry(w + 0.2, 0.15, d + 0.2), mat(COL.roof), cx, h + 0.07, cz);   // 屋上の雪
  const f = cx > 0 ? -1 : 1, fx = cx + f * (w / 2 + 0.02);                                // f: 道路側の向き
  const win = deco(new THREE.PlaneGeometry(d * 0.7, 2.2), mat(0x000000, 0xffe2a8), fx, 1.6, cz);
  win.rotation.y = f * Math.PI / 2;
  const sign = deco(new THREE.PlaneGeometry(d * 0.8, 1.0), mat(0x000000, signColor), fx, h - 1.0, cz);
  sign.rotation.y = f * Math.PI / 2;
  const aw = deco(new THREE.BoxGeometry(1.4, 0.1, d * 0.8), mat(signColor), cx + f * (w / 2 + 0.6), 3.1, cz);
  aw.rotation.z = -f * 0.35;
}

// 雪だるま（当たり判定は細い箱）
function snowman(x, z) {
  const white = mat(0xf4f6fb);
  deco(new THREE.SphereGeometry(0.6, 16, 12), white, x, 0.6, z);
  deco(new THREE.SphereGeometry(0.42, 16, 12), white, x, 1.5, z);
  deco(new THREE.SphereGeometry(0.3, 14, 10), white, x, 2.15, z);
  const nose = deco(new THREE.ConeGeometry(0.06, 0.3, 8), mat(0xff8a2a), x, 2.15, z + 0.38);
  nose.rotation.x = Math.PI / 2;
  deco(new THREE.CylinderGeometry(0.22, 0.22, 0.3, 12), mat(0x1b1b1f), x, 2.55, z);
  addBox(x, 0, z, 1.0, 2.4, 1.0);
}

function buildWorld() {
  const s = W.scene;
  s.background = new THREE.Color(0x0b1430);
  s.fog = new THREE.Fog(0x0b1430, 35, 120);
  s.add(new THREE.HemisphereLight(0x9fb4ff, 0x30384f, 0.8));
  const moon = new THREE.DirectionalLight(0xbfd0ff, 0.45);
  moon.position.set(-30, 60, -20);
  s.add(moon);
  // 反対側から弱い暖色の光（家の明かりの照り返し）。月の当たらない面が真っ暗にならないように
  const fill = new THREE.DirectionalLight(0xffd9b0, 0.3);
  fill.position.set(30, 25, 40);
  s.add(fill);
  const mm = new THREE.Mesh(new THREE.SphereGeometry(6, 24, 16), new THREE.MeshBasicMaterial({ color: 0xfff4d6, fog: false }));
  mm.position.set(-80, 70, -140);
  s.add(mm);

  // ======== 地面と切れ目 ========
  const ground = (z0, z1) => solid(0, -4, (z0 + z1) / 2, 200, 4, Math.abs(z1 - z0), mat(COL.snow));
  const R = COURSE.riverHalf, RL = COURSE.rail, CY = COURSE.canyon, WL = COURSE.wall, DK = COURSE.deck;
  ground(110, R);              // 1 住宅街（見た目のため街の外まで）
  ground(-R, RL.z0);           // 2 商店街
  ground(RL.z1, CY.z0);        // 3 公園 と 4 高架下（間は塀で仕切る）
  ground(CY.z1, -300);         // 5 最後の家（見た目のため街の外まで）
  cut(R, -R, -2.5, mat(0x9fc6e8, 0x1a2a40));             // 凍った川
  cut(RL.z0, RL.z1, -2.5, mat(0x4a4642));                 // 線路の掘割
  cut(CY.z0, CY.z1, -8, mat(0x232838));                   // 谷
  // 線路（見た目だけ）。止まっている列車は buildTrain()（34-hazards-view.js）で置く
  const railZ = (RL.z0 + RL.z1) / 2;
  for (const off of [-0.75, 0.75]) deco(new THREE.BoxGeometry(200, 0.15, 0.12), mat(0x9aa0aa), 0, -2.4, railZ + off);
  // 落ちた橋（川の両岸。見た目だけ）
  for (const sd of [1, -1]) {
    const stub = deco(new THREE.BoxGeometry(8, 0.5, 3.2), mat(0x6b5a4a), 0, -1.3, sd * (R - 1.2));
    stub.rotation.x = sd * 0.75;
  }

  // ======== 1 住宅街（z = +62〜+7） ========
  road(62, R);
  barrier(R + 0.6);
  sleigh(COURSE.sleigh.x, COURSE.sleigh.z);
  // 28m のマンション（川の縁）。家の屋根（約 8m）→ 17m の中段 → 屋上 と登り、屋上から跳べば川を越える
  building(15, 13, 12, 12, 28, 0x7d8aa3);
  building(28, 21, 8, 12, 17, 0x8a7f96);
  house(16, 27, 9, 8, 6.5, 0x9fb7c9);
  building(-14, 11, 10, 8, 11, 0xa08f7d);        // 11m の建物（川の縁）。ここからはぎりぎり届く近道
  house(-17, 30, 9, 8, 4.5, 0xc9b79c);           // ★ 1 軒目
  house(-32, 46, 8, 8, 4.5, 0xd1b0c4);

// 雪。サンタの周り 80m 四方・高さ 40m の中を降り続け、はみ出たら反対側へ回す。
function makeSnow() {
  const N = 1800, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    pos[i * 3] = (Math.random() - 0.5) * 80;
    pos[i * 3 + 1] = Math.random() * 40;
    pos[i * 3 + 2] = (Math.random() - 0.5) * 80;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  W.snow = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, transparent: true, opacity: 0.85 }));
  W.snow.frustumCulled = false;
  W.scene.add(W.snow);
}
function wrapAround(v, c, h) {
  while (v < c - h) v += 2 * h;
  while (v > c + h) v -= 2 * h;
  return v;
}
function updateSnow(center, dt, t) {
  const a = W.snow.geometry.attributes.position, arr = a.array;
  for (let i = 0; i < arr.length; i += 3) {
    arr[i + 1] -= 1.6 * dt;
    arr[i] += Math.sin(t * 0.7 + i) * 0.3 * dt;
    if (arr[i + 1] < center.y - 10) arr[i + 1] += 40;
    arr[i] = wrapAround(arr[i], center.x, 40);
    arr[i + 2] = wrapAround(arr[i + 2], center.z, 40);
  }
  a.needsUpdate = true;
}

// 電線の束（3 本、横 0.6m おき）と、両端の電柱（電柱は電線の真下に立ち、当たり判定あり。腕木と電線は見た目だけ）
function buildWires() {
  for (const w of COURSE.wires) {
    const len = Math.abs(w.a1 - w.a0), mid = (w.a0 + w.a1) / 2;
    const g = new THREE.Group();
    for (const off of [-0.6, 0, 0.6]) {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, len, 6), mat(0x15171c));
      if (w.ax === 'x') { m.rotation.z = Math.PI / 2; m.position.set(mid, w.y, w.c + off); }
      else { m.rotation.x = Math.PI / 2; m.position.set(w.c + off, w.y, mid); }
      g.add(m);
    }
    W.scene.add(g);
    for (const a of [w.a0, w.a1]) {
      const px = w.ax === 'x' ? a : w.c, pz = w.ax === 'x' ? w.c : a;
      solid(px, 0, pz, 0.3, w.y + 0.4, 0.3, mat(0x5a4a3a));   // 電柱（歩道の上、電線の真下）
      deco(new THREE.BoxGeometry(w.ax === 'x' ? 0.15 : 1.6, 0.15, w.ax === 'x' ? 1.6 : 0.15), mat(0x5a4a3a), px, w.y, pz);   // 腕木
    }
    w.shake = 0;
    HZ.wires.push({ w, g });
  }
}

// 掘割の底に止まっている列車（8 両、19.5m おき。車両ごとに Group にして動かす。屋根に乗れる）
function buildTrain() {
  const RL = COURSE.rail, TR = COURSE.train, zc = (RL.z0 + RL.z1) / 2, top = -2.5 + TR.h;
  const xs = [];
  for (let k = -4; k <= 3; k++) xs.push(k * 19.5);   // 止まっている間は x=0（道路の真ん中）に車両がある
  const tr = newTrain(xs, zc, 18, TR.w, -2.5, TR.h, 8 * 19.5);
  for (const c of tr.cars) {
    PHYS.boxes.push(c.box);
    const g = new THREE.Group();
    const add = (geo, m, x, y, z) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); g.add(o); return o; };
    add(new THREE.BoxGeometry(18, TR.h, TR.w), mat(0x2f6f4f), 0, -2.5 + TR.h / 2, zc);
    add(new THREE.BoxGeometry(18, 0.12, TR.w - 0.2), mat(COL.snow), 0, top + 0.06, zc);           // 屋根の雪
    for (const sd of [1, -1]) {
      add(new THREE.BoxGeometry(18.02, 0.35, 0.05), mat(0xd8322c), 0, top - 2.6, zc + sd * (TR.w / 2 + 0.01));   // 赤い帯
      for (let wx = -7.5; wx <= 7.5; wx += 2.5) {                                                    // 明かりのついた窓
        const win = add(new THREE.PlaneGeometry(1.6, 1.0), mat(0x000000, COL.glass), wx, top - 1.4, zc + sd * (TR.w / 2 + 0.02));
        if (sd < 0) win.rotation.y = Math.PI;
      }
    }
    g.position.x = c.x;
    W.scene.add(g);
    c.group = g;
  }
  HZ.train = tr;

  // 街の両端（x = ±41〜）の線路はトンネル。列車は片方のトンネルに入り、反対側から出てくる（見た目だけ。街の外なので触れない）
  const BX = COURSE.bounds.x + 1, d = Math.abs(RL.z1 - RL.z0);

    deco(new THREE.BoxGeometry(60, 16, d), mat(0x55586a), sd * (BX + 30), -2.5 + 8, zc);                // トンネルの山（線路を覆う）
    deco(new THREE.BoxGeometry(60, 0.3, d), mat(COL.snow), sd * (BX + 30), 13.65, zc);                   // 山の上の雪
    const hole = deco(new THREE.PlaneGeometry(TR.w + 0.8, TR.h + 0.4), mat(0x05060a), sd * (BX - 0.02), -2.5 + (TR.h + 0.4) / 2, zc);
    hole.rotation.y = sd > 0 ? -Math.PI / 2 : Math.PI / 2;                                              // 入口の暗がり（街の側を向く）
  }
}

// 逃げる家（3 軒目）。house() を呼んで、そのとき増えたメッシュと当たり判定の箱を捕まえ、いっしょに動かす
function buildRunaway() {
  const RA = COURSE.runaway;
  const nBox = PHYS.boxes.length, nObj = W.scene.children.length;
  house(RA.x, RA.z, 9, 8, 4.5, 0xa9c3a0);
  const boxes = PHYS.boxes.slice(nBox), meshes = W.scene.children.slice(nObj);
  for (const m of meshes) m.userData.base = m.position.clone();
  const ra = newRunaway(RA.x, RA.z, boxes, W.houses[W.houses.length - 1].chimney, RA.bounds);
  ra.meshes = meshes;
  ra.target = RA.target;
  ra.lift = 0;
  ra.noticed = false;
  // 脚（逃げている間だけ見える）
  ra.legs = [];
  for (const lx of [-2.5, 2.5]) for (const lz of [-2, 2]) {
    const leg = deco(new THREE.CylinderGeometry(0.25, 0.2, 1.2, 8), mat(0x8a5a3a), RA.x + lx, 0.6, RA.z + lz);
    leg.visible = false;
    leg.userData.base = leg.position.clone();
    ra.legs.push(leg);
  }
  HZ.runaway = ra;
}

function updateHazardViews(dt, t) {
  for (const hw of HZ.wires) {
    hw.w.shake = Math.max(0, hw.w.shake - dt * 2);
    hw.g.position.y = Math.sin(t * 40) * 0.25 * hw.w.shake;   // 引っかかった電線がビヨンと揺れる
  }
  for (const c of HZ.cars) {
    c.mesh.position.set(c.x, 0, c.z);
    c.mesh.rotation.y = c.dir > 0 ? Math.PI : 0;   // 進む向きに正面（-Z）を向ける
  }
  if (HZ.train) for (const c of HZ.train.cars) c.group.position.x = c.x;
  const ra = HZ.runaway;
  if (ra) {
    // 逃げている間は家が持ち上がって脚が生え、トコトコ跳ねる（見た目だけ。当たり判定は地面のまま）
    const running = ra.fleeing && !ra.caught;
    ra.lift += ((running ? 1.2 : 0) - ra.lift) * Math.min(1, dt * 8);
    const bob = running ? Math.abs(Math.sin(t * 12)) * 0.35 : 0;
    const ox = ra.x - ra.x0, oz = ra.z - ra.z0, up = ra.lift + bob;
    for (const m of ra.meshes) m.position.set(m.userData.base.x + ox, m.userData.base.y + up, m.userData.base.z + oz);
    ra.legs.forEach((L, i) => {
      L.visible = ra.lift > 0.1;
      L.position.set(L.userData.base.x + ox, up / 2, L.userData.base.z + oz);
      L.scale.y = Math.max(0.01, up / 1.2);
      L.rotation.x = running ? Math.sin(t * 12 + i * Math.PI) * 0.5 : 0;
    });
  }
}

  add(new THREE.SphereGeometry(0.24, 16, 12), skin, 0, 1.5, 0);                    // 顔
  add(new THREE.SphereGeometry(0.2, 12, 10), white, 0, 1.38, -0.12);               // ひげ
  add(new THREE.SphereGeometry(0.03, 6, 6), black, -0.08, 1.56, -0.22);            // 目

  add(new THREE.ConeGeometry(0.25, 0.45, 14), red, 0, 1.88, 0.02);                 // 帽子

// 角度 a を b へ、最短の回り方で f の割合だけ近づける
function lerpAngle(a, b, f) {
  let d = b - a;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return a + d * f;
}

function updateSantaMesh(sm, s, dt, t) {
  sm.group.position.set(s.pos.x, s.pos.y, s.pos.z);
  sm.rot = lerpAngle(sm.rot, s.facing, Math.min(1, dt * 14));
  sm.group.rotation.y = sm.rot;
  if (s.onGround) {
    const sp = Math.min(1, Math.hypot(s.vel.x, s.vel.z) / CFG.walkSpeed);
    const sw = Math.sin(t * 11) * 0.7 * sp;
    sm.legL.rotation.x = sw;  sm.legR.rotation.x = -sw;
    sm.armL.rotation.x = -sw * 0.8; sm.armR.rotation.x = sw * 0.8;
  } else {
    // 空中：両腕を前上へ上げ、脚を少し前後に開く
    sm.armL.rotation.x = sm.armR.rotation.x = 2.6;
    sm.legL.rotation.x = 0.4; sm.legR.rotation.x = -0.4;
  }
  // プレゼントを持っているときは、両腕を上げて頭の上に掲げる
  if (sm.carrying) sm.armL.rotation.x = sm.armR.rotation.x = 2.9;
  sm.present.visible = sm.carrying;
  // 着地でつぶれて、すぐ戻る
  sm.squash = Math.max(0, sm.squash - dt * 2.5);
  sm.group.scale.set(1 + sm.squash * 0.5, 1 - sm.squash, 1 + sm.squash * 0.5);
}

// プレゼント（緑の箱に金のリボン）
function makePresentMesh() {
  const g = new THREE.Group(), s = 0.55, gold = mat(0xffd84d, 0x6a4a00);
  g.add(new THREE.Mesh(new THREE.BoxGeometry(s, s, s), mat(0x2f9e57)));
  g.add(new THREE.Mesh(new THREE.BoxGeometry(s + 0.02, s + 0.02, 0.1), gold));
  g.add(new THREE.Mesh(new THREE.BoxGeometry(0.1, s + 0.02, s + 0.02), gold));
  const bow = new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.035, 6, 12), gold);
  bow.position.y = s / 2 + 0.06;
  g.add(bow);
  return g;
}

// 落としたプレゼントを宙に放り出す（見た目だけ。当たり判定なし。川の氷の下へ消える）
function throwPresent(sm) {
  clearThrown(sm);
  const wp = new THREE.Vector3();
  sm.present.getWorldPosition(wp);
  const m = makePresentMesh();
  m.position.copy(wp);
  W.scene.add(m);
  sm.thrown = { mesh: m, vx: (Math.random() - 0.5) * 3, vy: 7, vz: (Math.random() - 0.5) * 3 };
}
function updateThrown(sm, dt) {
  const th = sm.thrown;
  if (!th) return;
  th.vy -= CFG.gravity * dt;
  th.mesh.position.x += th.vx * dt;
  th.mesh.position.y += th.vy * dt;
  th.mesh.position.z += th.vz * dt;
  th.mesh.rotation.x += 6 * dt;
  th.mesh.rotation.z += 4 * dt;
  if (th.mesh.position.y < -30) clearThrown(sm);
}
function clearThrown(sm) {
  if (!sm.thrown) return;
  W.scene.remove(sm.thrown.mesh);
  sm.thrown = null;
}

// 真下の影（いつも）と、着地点の目印の輪（空中だけ。建物越しでも見える）
function makeMarker() {
  const shadow = new THREE.Mesh(new THREE.CircleGeometry(0.55, 24),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.45, depthWrite: false }));
  shadow.rotation.x = -Math.PI / 2;
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.75, 0.95, 32),
    new THREE.MeshBasicMaterial({ color: 0xffd27a, transparent: true, opacity: 0.9, depthTest: false, depthWrite: false, fog: false }));
  ring.rotation.x = -Math.PI / 2;
  ring.renderOrder = 10;
  W.scene.add(shadow);
  W.scene.add(ring);
  return { shadow, ring };
}

function updateMarker(mk, s, t) {
  const gy = s.onGround ? s.pos.y : groundBelow(s.pos, PHYS.boxes);
  const ok = isFinite(gy);
  mk.shadow.visible = ok;
  mk.ring.visible = ok && !s.onGround;
  if (!ok) return;
  mk.shadow.position.set(s.pos.x, gy + 0.04, s.pos.z);
  mk.ring.position.set(s.pos.x, gy + 0.06, s.pos.z);
  const pulse = 1 + Math.sin(t * 10) * 0.08;
  mk.ring.scale.set(pulse, pulse, 1);
}
// ===== 配達の見た目（光の柱・煙突へ入るプレゼント） =====
const FX = { down: null };

function lerp(a, b, k) { return a + (b - a) * k; }

// 光の柱。配達先の煙突から空へ伸びる。サンタの足元が beaconMinY より高いときだけ見える
function makeBeacon() {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.3, 120, 16, 1, true),
    new THREE.MeshBasicMaterial({ color: 0xffb020, transparent: true, opacity: 0, depthWrite: false, fog: false,
      side: THREE.DoubleSide }));   // 加算合成だと雪の白の上で白くなって見えないので、ふつうの合成で濃い金色
  m.visible = false;
  W.scene.add(m);
  return { mesh: m, alpha: 0 };
}

// ch: いまの配達先の煙突（クリア後は null）
function updateBeacon(b, ch, s, dt, t) {
  const want = ch && s.pos.y >= CFG.beaconMinY ? 1 : 0;
  b.alpha += (want - b.alpha) * Math.min(1, dt * 5);
  b.mesh.visible = !!ch && b.alpha > 0.01;
  if (!ch) return;
  b.mesh.position.set(ch.x, ch.y + 60, ch.z);
  b.mesh.material.opacity = b.alpha * (0.75 + Math.sin(t * 3) * 0.12);
}

// 届けたプレゼントが、サンタの頭の上から弧を描いて煙突の真上へ移り、煙突の中へ沈む
function sendDown(sm, ch) {
  if (FX.down) W.scene.remove(FX.down.mesh);
  const wp = new THREE.Vector3();
  sm.present.getWorldPosition(wp);
  const m = makePresentMesh();
  m.position.copy(wp);
  W.scene.add(m);
  FX.down = { mesh: m, from: wp, ch, t: 0 };
}

function updateFx(dt) {
  const d = FX.down;
  if (!d) return;
  d.t += dt;
  d.mesh.rotation.y += dt * 8;
  const k = Math.min(1, d.t / 0.35);
  if (k < 1) {
    // 0.35 秒で煙突の真上（1.2m 上）へ。途中で少し上に膨らむ
    d.mesh.position.set(lerp(d.from.x, d.ch.x, k), lerp(d.from.y, d.ch.y + 1.2, k) + Math.sin(k * Math.PI) * 1.2, lerp(d.from.z, d.ch.z, k));
    return;
  }
  // 0.4 秒で煙突の中へ沈む
  const k2 = Math.min(1, (d.t - 0.35) / 0.4);
  d.mesh.position.set(d.ch.x, d.ch.y + 1.2 - k2 * 2.2, d.ch.z);
  d.mesh.scale.setScalar(1 - k2 * 0.5);
  if (k2 >= 1) { W.scene.remove(d.mesh); FX.down = null; }
}
// ===== 三人称カメラ =====
const CAM = { yaw: 0, pitch: CFG.camPitch, dist: CFG.camDist, cam: null, ty: null, tp: 0 };

// マウス・タッチの動き（ラジアン）。右へ動かすと右を向き、下へ動かすと見下ろす。
function camLook(dx, dy) {
  CAM.yaw -= dx;
  CAM.pitch = Math.min(CFG.camPitchMax, Math.max(CFG.camPitchMin, CAM.pitch + dy));
}

function updateCamera(s, dt) {
  // 空中では注視点を下げ、カメラを後ろへ引いて、サンタと真下の着地点が両方画面に入るようにする
  const gy = groundBelow(s.pos, PHYS.boxes);
  const h = s.onGround || !isFinite(gy) ? 0 : Math.min(CFG.camAirMaxH, Math.max(0, s.pos.y - gy));
  const wantY = s.pos.y + CFG.camLookHeight - h * CFG.camAirDrop;
  const wantP = Math.min(1, h / CFG.jumpHeight) * CFG.camAirPitch;
  const f = Math.min(1, dt * 6);
  CAM.ty = CAM.ty === null ? wantY : CAM.ty + (wantY - CAM.ty) * f;
  CAM.tp += (wantP - CAM.tp) * f;
  const pitch = Math.min(1.45, CAM.pitch + CAM.tp);

  const target = { x: s.pos.x, y: CAM.ty, z: s.pos.z };
  const p = cameraPlace(target, CAM.yaw, pitch, PHYS.boxes, CFG.camDist + h * CFG.camAirBack);
  // 壁に寄るときはすぐ、離れるときはゆっくり戻す（カメラがガクガクしないように）
  CAM.dist = p.dist < CAM.dist ? p.dist : CAM.dist + (p.dist - CAM.dist) * Math.min(1, dt * 5);
  const d = p.dir;
  CAM.cam.position.set(target.x + d.x * CAM.dist, target.y + d.y * CAM.dist, target.z + d.z * CAM.dist);
  CAM.cam.lookAt(target.x, target.y, target.z);
}
// ===== 入力（キーボード・マウス・タッチ） =====
const INPUT = { keys: {}, lookX: 0, lookY: 0, stick: null, lookTouch: null, touch: false, jump: false, act: false };
const STICK_R = 50;   // スティックを倒しきる距離 px

function initInput(canvas) {
  addEventListener('keydown', e => {
    INPUT.keys[e.code] = true;
    if (e.code === 'Space' && !e.repeat) INPUT.jump = true;
    if (e.code === 'KeyE' && !e.repeat) INPUT.act = true;
    if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
  });
  addEventListener('keyup', e => { INPUT.keys[e.code] = false; });
  addEventListener('blur', () => { INPUT.keys = {}; });

  addEventListener('mousemove', e => {
    if (document.pointerLockElement !== canvas) return;
    INPUT.lookX += e.movementX * CFG.mouseSens;
    INPUT.lookY += e.movementY * CFG.mouseSens;
  });
  canvas.addEventListener('click', () => {
    if (!INPUT.touch && canvas.requestPointerLock && document.pointerLockElement !== canvas) lockPointer(canvas);
  });

  // タッチ：画面の左半分は移動スティック（触れた場所に出る）、右半分はドラッグで視点
  const stickEl = document.getElementById('stick'), knob = document.getElementById('knob');
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    INPUT.touch = true;
    document.body.classList.add('touch');
    for (const t of e.changedTouches) {
      if (t.clientX < innerWidth / 2 && !INPUT.stick) {
        INPUT.stick = { id: t.identifier, ox: t.clientX, oy: t.clientY, x: 0, z: 0 };
        stickEl.style.left = t.clientX + 'px';
        stickEl.style.top = t.clientY + 'px';
        knob.style.transform = '';
        stickEl.classList.add('on');
      } else if (!INPUT.lookTouch) {
        INPUT.lookTouch = { id: t.identifier, x: t.clientX, y: t.clientY };
      }
    }
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      const s = INPUT.stick, l = INPUT.lookTouch;
      if (s && t.identifier === s.id) {
        let dx = t.clientX - s.ox, dy = t.clientY - s.oy;
        const len = Math.hypot(dx, dy);
        if (len > STICK_R) { dx *= STICK_R / len; dy *= STICK_R / len; }
        s.x = dx / STICK_R;
        s.z = -dy / STICK_R;
        knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
      } else if (l && t.identifier === l.id) {
        INPUT.lookX += (t.clientX - l.x) * CFG.touchSens;
        INPUT.lookY += (t.clientY - l.y) * CFG.touchSens;
        l.x = t.clientX;
        l.y = t.clientY;
      }
    }
  }, { passive: false });
  const end = e => {
    for (const t of e.changedTouches) {
      if (INPUT.stick && t.identifier === INPUT.stick.id) { INPUT.stick = null; stickEl.classList.remove('on'); }
      if (INPUT.lookTouch && t.identifier === INPUT.lookTouch.id) INPUT.lookTouch = null;
    }
  };
  canvas.addEventListener('touchend', end);
  canvas.addEventListener('touchcancel', end);

  // スマホのジャンプボタン（canvas の外なので、視点ドラッグとは別に押せる）
  const jb = document.getElementById('jumpBtn');
  jb.addEventListener('touchstart', e => { e.preventDefault(); INPUT.jump = true; }, { passive: false });
  const ab = document.getElementById('actBtn');
  ab.addEventListener('touchstart', e => { e.preventDefault(); INPUT.act = true; }, { passive: false });
}

// 移動入力 {x: 右が+, z: 前が+}
function readMove() {
  if (INPUT.stick) return { x: INPUT.stick.x, z: INPUT.stick.z };
  const k = INPUT.keys;
  const x = (k.KeyD || k.ArrowRight ? 1 : 0) - (k.KeyA || k.ArrowLeft ? 1 : 0);
  const z = (k.KeyW || k.ArrowUp ? 1 : 0) - (k.KeyS || k.ArrowDown ? 1 : 0);
  return { x, z };
}
// たまった視点の動きを受け取って空にする
function takeLook() {
  const l = { x: INPUT.lookX, y: INPUT.lookY };
  INPUT.lookX = 0;
  INPUT.lookY = 0;
  return l;
}

// ジャンプが押されたか（押された瞬間に 1 回だけ true）
function takeJump() {
  const j = INPUT.jump;
  INPUT.jump = false;
  return j;
}

// E（受け取る・届ける）が押されたか（押された瞬間に 1 回だけ true）
function takeAct() {
  const a = INPUT.act;
  INPUT.act = false;
  return a;
}

// マウスを画面に固定する。環境によって断られ、そのとき Promise が reject されるので握りつぶす
function lockPointer(canvas) {
  if (!canvas.requestPointerLock) return;
  const p = canvas.requestPointerLock();
  if (p && p.catch) p.catch(() => {});
}
// ===== 画面の文字（目的・お知らせ・操作の案内） =====
const HUD = { toastTimer: 0 };

// 左上の「いまやること」。空文字なら隠す
function setObjective(text) {
  document.getElementById('objText').textContent = text;
  document.getElementById('obj').classList.toggle('on', !!text);
}

// 画面中央の大きなお知らせ。sec 秒で消える
function showToast(text, sec) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('on');
  HUD.toastTimer = sec || 2;
}

// 下の操作の案内（「E で受け取る」など）。null なら隠す
function setPrompt(text) {
  const el = document.getElementById('prompt');
  if (el.textContent !== (text || '')) el.textContent = text || '';
  el.classList.toggle('on', !!text);
}

function updateHud(dt) {
  if (HUD.toastTimer <= 0) return;
  HUD.toastTimer -= dt;
  if (HUD.toastTimer <= 0) document.getElementById('toast').classList.remove('on');
}

// 右上のタイム
function setTimer(sec) {
  const el = document.getElementById('timer');
  const txt = fmtTime(sec);
  if (el.textContent !== txt) el.textContent = txt;
  el.classList.add('on');
}

// クリア画面
function showClear(time, best, isNew) {
  document.getElementById('clearTime').textContent = fmtTime(time);
  document.getElementById('clearBest').textContent = isNew ? '自己ベスト更新！' : '自己ベスト ' + fmtTime(best);
  document.getElementById('clear').classList.add('on');
}
function hideClear() {
  document.getElementById('clear').classList.remove('on');
}

// 自己ベスト（この端末のブラウザに保存。保存できない環境では null のまま）
const BEST_KEY = 'santa-todokete.best';
function loadBest() {
  try {
    const v = parseFloat(localStorage.getItem(BEST_KEY));
    return isFinite(v) ? v : null;
  } catch (e) { return null; }
}
function saveBest(v) {
  try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) { /* 保存できなくても遊べる */ }
}
// ===== 起動とメインループ =====
(function boot() {
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  document.body.prepend(renderer.domElement);

  W.scene = new THREE.Scene();
  buildWorld();
  buildWires();
  buildCars();
  buildTrain();
  buildRunaway();
  makeSnow();
  const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 400);
  CAM.cam = camera;

  const START = COURSE.start;
  const santa = newSanta(START.x, START.z);
  const sm = makeSantaMesh();
  const mk = makeMarker();
  // 配達先：COURSE.targets の家の煙突を、届ける順に並べる
  const chimneys = W.houses.map(h => h.chimney);
  const targets = COURSE.targets.map(tg => W.houses.find(h => h.x === tg.x && h.z === tg.z).chimney);
  let run = newRun(targets);
  let best = loadBest();
  const beacon = makeBeacon();

  function objectiveText() {
    if (!run.carrying && run.target === 0) return 'そりでプレゼントを受け取ろう';
    return '高く跳んで光の柱を探し、煙突から届けよう（' + run.target + '/' + run.targets.length + '）';
  }

  function finish() {
    sndClear();
    const r = bestAfter(best, run.time);
    best = r.best;
    if (r.isNew) saveBest(best);
    setObjective('');
    setPrompt(null);
    setTimeout(() => {
      showClear(run.time, best, r.isNew);
      if (document.exitPointerLock) document.exitPointerLock();
    }, 900);
  }

  document.getElementById('againBtn').addEventListener('click', () => {
    run = newRun(targets);
    placeAt(santa, COURSE.start);
    clearThrown(sm);
    resetRunaway(HZ.runaway);
    HZ.runaway.noticed = false;
    hideClear();
    setObjective(objectiveText());
    if (!INPUT.touch) lockPointer(renderer.domElement);
  });
  initInput(renderer.domElement);

  addEventListener('resize', () => {
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
  });

  // タイトル：クリック・タップで始める
  let started = false;
  const title = document.getElementById('title');
  title.addEventListener('touchstart', () => { INPUT.touch = true; document.body.classList.add('touch'); }, { passive: true });
  title.addEventListener('click', () => {
    started = true;
    title.classList.add('off');
    sndInit();
    setObjective(objectiveText());
    const cv = renderer.domElement;
    if (!INPUT.touch) lockPointer(cv);
  });

  let last = performance.now(), t = 0, walked = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    t += dt;
    if (started) {
      const l = takeLook();
      camLook(l.x, l.y);
      const bx = santa.pos.x, bz = santa.pos.z;
      const playing = run.state === 'play' && !run.cleared;
      const mv = playing ? readMove() : { x: 0, z: 0 };
      mv.jump = takeJump() && playing;
      const act = takeAct();
      for (const c of HZ.cars) {
        if (updateCar(c, santa, dt, PHYS.boxes) !== 'hit') continue;
        sndHonk();
        if (dropPresent(run)) {
          throwPresent(sm);
          sndDrop();
          showToast('車にはねられて、プレゼントを落とした！', CFG.dropDelay);
        } else {
          showToast('車にはねられた！', 1.2);
        }
      }
      // 理不尽ギミック：動き出す列車・逃げる家
      const trRes = updateTrain(HZ.train, santa, dt, PHYS.boxes);
      if (trRes === 'start') {
        sndWhistle();
        showToast('列車が動き出した！？', 1.6);
      } else if (trRes === 'scraped') {
        sndLand(1);
        if (dropPresent(run)) {
          throwPresent(sm);
          sndDrop();
          showToast('トンネルにぶつかって、プレゼントを落とした！', CFG.dropDelay);
        } else {
          showToast('トンネルにぶつかった！', 1.2);
        }
      }
      const ra = HZ.runaway, raRes = stepRunaway(ra, santa, dt, run.state === 'play' && run.target === ra.target);
      if (raRes === 'flee' && !ra.noticed) {
        ra.noticed = true;
        sndScurry();
        showToast('家が逃げた！？', 1.6);
      } else if (raRes === 'caught') {
        showToast('つかまえた！', 1.2);
      }
      santaStep(santa, mv, CAM.yaw, dt, PHYS.boxes);
      if (checkWires(santa, COURSE.wires, dt)) {
        sndBoing();
        if (dropPresent(run)) {
          throwPresent(sm);
          sndDrop();
          showToast('電線に引っかかって、プレゼントを落とした！', CFG.dropDelay);
        } else {
          showToast('電線に引っかかった！', 1.0);
        }
      }
      if (santa.jumped) { santa.jumped = false; sndJump(); }
      if (santa.landSpeed > 0) {
        // 歩道の段差を降りたくらいの小さな着地は無視する
        if (santa.landSpeed > 4) {
          sndLand(Math.min(1, santa.landSpeed / 30));
          sm.squash = Math.min(0.35, santa.landSpeed / 60);
        }
        santa.landSpeed = 0;
      }
      // 雪を踏む音（地面を 1.1m 進むごと）
      if (santa.onGround) {
        walked += Math.hypot(santa.pos.x - bx, santa.pos.z - bz);
        if (walked > 1.1) { walked = 0; sndStep(); }
      }
      // プレゼント：受け取る・届ける・落とす・やり直し
      if (act) {
        if (tryPickup(run, santa, COURSE.sleigh)) {
          sndPickup();
          showToast('プレゼントを受け取った！', 1.6);
          setObjective(objectiveText());
        } else {
          const ch = run.targets[run.target];
          const res = tryDeliver(run, santa, chimneys);
          if (res === 'wrong') {
            sndWrong();
            showToast('この家じゃない！', 1.2);
          } else if (res === 'delivered' || res === 'cleared') {
            sendDown(sm, ch);
            sndDeliver();
            if (res === 'delivered') {
              showToast('配達完了！ ' + run.target + '/' + run.targets.length, 1.8);
              setObjective(objectiveText());
            } else {
              finish();
            }
          }
        }
      }
      const ev = stepRun(run, santa, dt, COURSE.respawn);
      if (ev === 'dropped') {
        throwPresent(sm);
        sndDrop();
        showToast('プレゼントを落とした！', CFG.dropDelay);
      } else if (ev === 'respawn') {
        clearThrown(sm);
        showToast(run.target === 0 ? 'そりからやり直し' : '届けた家の前からやり直し', 1.4);
      }
      tickTime(run, dt);
      setTimer(run.time);
      const goal = run.targets[run.target];
      const canPick = !run.carrying && run.state === 'play' && nearPickup(santa, COURSE.sleigh);
      const canGive = run.carrying && run.state === 'play' && goal && nearChimney(santa, goal);
      setPrompt(canPick ? (INPUT.touch ? '「受け取る」ボタンで受け取る' : 'E で受け取る')
              : canGive ? (INPUT.touch ? '「届ける」ボタンで届ける' : 'E で届ける') : null);
      const ab = document.getElementById('actBtn'), abText = run.carrying ? '届ける' : '受け取る';
      if (ab.textContent !== abText) ab.textContent = abText;
      sm.carrying = run.carrying;
    }
    updateSantaMesh(sm, santa, dt, t);
    updateThrown(sm, dt);
    updateHud(dt);
    updateBeacon(beacon, run.cleared ? null : run.targets[run.target], santa, dt, t);
    updateFx(dt);
    updateHazardViews(dt, t);
    updateMarker(mk, santa, t);
    updateCamera(santa, dt);
    updateSnow(santa.pos, dt, t);
    renderer.render(W.scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // 画面確認用（コンソールから位置やカメラを動かせる）
  window.GAME = { santa, get run() { return run; }, sm, CAM, PHYS, W, renderer, camera };
})();
</script>
